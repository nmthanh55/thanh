<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TestDB Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">TestDB Hub <span class="sub">MySQL + HeliosDB-Nano</span></div>
    <div id="engine-status" class="status-row"></div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <section id="empty" class="empty">
        <h2>Chọn một database hoặc nhánh bên trái</h2>
        <p>Mỗi database có nhánh <b>main</b>. Tạo nhánh để thử nghiệm mà không ảnh hưởng dữ liệu gốc,
          chụp snapshot để khôi phục sau, hoặc sao chép bảng giữa MySQL và HeliosDB-Nano.</p>
      </section>

      <section id="workspace" hidden>
        <div class="context">
          <div class="crumbs" id="crumbs"></div>
          <div class="actions" id="actions"></div>
        </div>

        <div class="tables-bar">
          <span class="label">Bảng:</span>
          <div id="tables" class="chips"></div>
        </div>

        <div class="editor-wrap">
          <textarea id="sql" spellcheck="false" placeholder="Nhập câu SQL... (Ctrl+Enter để chạy, nhiều câu cách nhau bằng ;)"></textarea>
          <div class="editor-tools">
            <button class="primary" id="run">▶ Chạy (Ctrl+Enter)</button>
            <button id="sample">Dữ liệu mẫu</button>
            <label class="file-btn">Mở file .sql<input type="file" id="import-file" accept=".sql,.txt" hidden></label>
            <span class="hint" id="run-hint"></span>
          </div>
        </div>

        <div id="results"></div>
      </section>
    </main>
  </div>

  <dialog id="modal">
    <form method="dialog" id="modal-form">
      <h3 id="modal-title"></h3>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button value="cancel" formnovalidate>Huỷ</button>
        <button value="ok" class="primary" id="modal-ok">OK</button>
      </div>
    </form>
  </dialog>

  <div id="toasts"></div>
  <script src="app.js"></script>
</body>
</html>
