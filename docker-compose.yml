# MySQL + HeliosDB-Nano for TestDB Hub. Start with: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-testpass}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  helios:
    build: ./docker/helios
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - helios-data:/data

volumes:
  mysql-data:
  helios-data:
